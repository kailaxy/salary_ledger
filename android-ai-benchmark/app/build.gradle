plugins { id 'com.android.application' }
def benchVersionCode = (System.getenv('BENCH_VERSION_CODE') ?: '1').toInteger()
android {
    namespace 'com.kailaxy.salaryledger.aibench'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.kailaxy.salaryledger.aibench'
        minSdk 26
        targetSdk 35
        versionCode benchVersionCode
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cFlags '-O3 -DNDEBUG'; cppFlags '-std=c++17 -O3 -DNDEBUG' } }
    }
    signingConfigs { debug {
        if (System.getenv('LEDGER_DEBUG_KEYSTORE_PATH')) {
            storeFile file(System.getenv('LEDGER_DEBUG_KEYSTORE_PATH'))
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
    } }
    buildTypes { debug { if (System.getenv('BENCH_PREVIEW') == 'true') applicationIdSuffix '.preview' } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = ["$buildDir/generated/benchmarkAssets"]
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError true; disable 'SetTextI18n', 'HardcodedText' }
}
tasks.register('prepareBenchmarkAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'android-ai-benchmark/tools/generate-assets.cjs'
    inputs.file providers.environmentVariable('BENCH_MODEL_MANIFEST').orElse(rootProject.file('model-manifest.json').absolutePath)
    inputs.files fileTree(rootProject.file('test-prompts')), rootProject.file('model-manifest.json'), rootProject.file('../web/ledger-query.js'), rootProject.file('../web/assistant-personality.js')
    outputs.dir "$buildDir/generated/benchmarkAssets"
    outputs.upToDateWhen { false }
}
tasks.named('preBuild').configure { dependsOn 'prepareBenchmarkAssets' }
dependencies { testImplementation 'junit:junit:4.13.2' }
