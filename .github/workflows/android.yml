name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release APK (requires signing secrets; main only)'
        type: boolean
        default: false
  push:
    paths: ['android/**', 'Index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'Index.html', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LEDGER_DEBUG_PREVIEW: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - name: Set increasing APK version
        shell: bash
        run: echo "LEDGER_VERSION_CODE=$((GITHUB_RUN_NUMBER + 3))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK root is missing from the runner environment." >&2
            exit 1
          fi
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "Android SDK manager not found at $sdk_manager" >&2
            exit 1
          fi
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build persistent development APK
        if: (github.event_name != 'workflow_dispatch' || !inputs.release) && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: android
        shell: bash
        env:
          LEDGER_DEBUG_KEYSTORE_BASE64: ${{ secrets.LEDGER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          export LEDGER_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/ledger-debug.jks"
          export LEDGER_REQUIRE_DEBUG_KEY=true
          trap 'rm -f "$LEDGER_DEBUG_KEYSTORE_PATH"' EXIT
          if [[ -z "$LEDGER_DEBUG_KEYSTORE_BASE64" ]]; then
            echo 'Add repository secret LEDGER_DEBUG_KEYSTORE_BASE64; see android/README.md.' >&2
            exit 1
          fi
          printf '%s' "$LEDGER_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$LEDGER_DEBUG_KEYSTORE_PATH"
          gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Build isolated preview without signing secrets
        if: (github.event_name != 'workflow_dispatch' || !inputs.release) && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Upload development or preview APK
        if: github.event_name != 'workflow_dispatch' || !inputs.release
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LEDGER_DEBUG_PREVIEW == 'true' && 'salary-ledger-preview-apk' || 'salary-ledger-debug-apk' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build signed release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        working-directory: android
        shell: bash
        env:
          LEDGER_KEYSTORE_BASE64: ${{ secrets.LEDGER_KEYSTORE_BASE64 }}
          LEDGER_KEYSTORE_PASSWORD: ${{ secrets.LEDGER_KEYSTORE_PASSWORD }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export LEDGER_KEYSTORE_PATH="$RUNNER_TEMP/ledger-release.jks"
          trap 'rm -f "$LEDGER_KEYSTORE_PATH"' EXIT
          for name in LEDGER_KEYSTORE_BASE64 LEDGER_KEYSTORE_PASSWORD LEDGER_KEY_ALIAS LEDGER_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$LEDGER_KEYSTORE_BASE64" | base64 --decode > "$LEDGER_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease lintRelease testReleaseUnitTest
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Require main for release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref != 'refs/heads/main'
        run: |
          echo 'Signed release builds must run on main.' >&2
          exit 1
      - name: Upload signed release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: salary-ledger-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
