name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LEDGER_WEB_APP_URL: ${{ vars.LEDGER_WEB_APP_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK root is missing from the runner environment." >&2
            exit 1
          fi
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "Android SDK manager not found at $sdk_manager" >&2
            exit 1
          fi
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and lint
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug lintDebug
      - uses: actions/upload-artifact@v6
        with:
          name: salary-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
