plugins { id 'com.android.application' }

def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def signingEnv = ['LEDGER_KEYSTORE_PATH', 'LEDGER_KEYSTORE_PASSWORD', 'LEDGER_KEY_ALIAS', 'LEDGER_KEY_PASSWORD']
def signingValues = signingEnv.collectEntries { [(it): System.getenv(it)] }
def debugKeystore = System.getenv('LEDGER_DEBUG_KEYSTORE_PATH')
def debugPreview = System.getenv('LEDGER_DEBUG_PREVIEW') == 'true'
if (System.getenv('LEDGER_REQUIRE_DEBUG_KEY') == 'true' && !debugKeystore) {
    throw new GradleException('Persistent development builds require LEDGER_DEBUG_KEYSTORE_PATH; see android/README.md')
}
if (releaseRequested && signingValues.any { key, value -> !value }) {
    throw new GradleException('Release builds require all four LEDGER signing environment variables; see android/README.md')
}
def buildNumber = System.getenv('LEDGER_VERSION_CODE') ?: '3'
if (!(buildNumber ==~ /[0-9]+/) || buildNumber.toLong() < 3 || buildNumber.toLong() > 2100000000) {
    throw new GradleException('LEDGER_VERSION_CODE must be an integer from 3 to 2100000000')
}

def ledgerUrl = providers.environmentVariable('LEDGER_WEB_APP_URL').orElse('').get().trim()
if (!ledgerUrl) {
    ledgerUrl = 'https://script.google.com/macros/s/AKfycbz0-dfJkKtvFhAAGehlzw6kaIqjKPUqpjgmaRO0ZqBLrk3PgvTNv23SSyklYUARnbov/exec'
}
if (ledgerUrl && !(ledgerUrl ==~ /https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/)) {
    throw new GradleException('LEDGER_WEB_APP_URL must be an HTTPS script.google.com/macros/s/.../exec deployment URL')
}
android {
    namespace 'com.kailaxy.salaryledger'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kailaxy.salaryledger'
        minSdk 26
        targetSdk 35
        versionCode buildNumber.toInteger()
        versionName '0.4.0'
        resValue 'string', 'app_name', 'Salary Ledger'
        buildConfigField 'String', 'LEDGER_WEB_APP_URL', '"' + ledgerUrl + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (debugKeystore) {
                storeFile file(debugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (signingValues.every { key, value -> value }) {
                storeFile file(signingValues.LEDGER_KEYSTORE_PATH)
                storePassword signingValues.LEDGER_KEYSTORE_PASSWORD
                keyAlias signingValues.LEDGER_KEY_ALIAS
                keyPassword signingValues.LEDGER_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix debugPreview ? '.debug.preview' : '.debug'
            versionNameSuffix debugPreview ? '-preview' : '-dev'
            resValue 'string', 'app_name', debugPreview ? 'Salary Ledger Preview' : 'Salary Ledger Dev'
        }
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}

def frontend = rootProject.file('../Index.html')
def generatedAssets = layout.buildDirectory.dir('generated/ledgerAssets')
tasks.register('generateLedgerAssets') {
    inputs.file(frontend)
    outputs.dir(generatedAssets)
    doLast {
        def text = frontend.getText('UTF-8')
        // The installed page has no network dependencies; system font fallbacks are intentional.
        text = text.replaceAll(/(?m)^<link[^>]*https:\/\/fonts\.(googleapis|gstatic)\.com[^>]*>\r?\n/, '')
        text = text.replaceAll(/(?m)^<base[^>]*>\r?\n/, '')
        def output = generatedAssets.get().file('Index.html').asFile
        output.parentFile.mkdirs()
        output.setText(text, 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.named('preBuild').configure { dependsOn('generateLedgerAssets') }
