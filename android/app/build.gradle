plugins { id 'com.android.application' }

def ledgerUrl = providers.environmentVariable('LEDGER_WEB_APP_URL').orElse('').get().trim()
if (!ledgerUrl) {
    ledgerUrl = 'https://script.google.com/macros/s/AKfycbz0-dfJkKtvFhAAGehlzw6kaIqjKPUqpjgmaRO0ZqBLrk3PgvTNv23SSyklYUARnbov/exec'
}
if (ledgerUrl && !(ledgerUrl ==~ /https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/)) {
    throw new GradleException('LEDGER_WEB_APP_URL must be an HTTPS script.google.com/macros/s/.../exec deployment URL')
}
android {
    namespace 'com.kailaxy.salaryledger'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kailaxy.salaryledger'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'LEDGER_WEB_APP_URL', '"' + ledgerUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}

def frontend = rootProject.file('../Index.html')
def generatedAssets = layout.buildDirectory.dir('generated/ledgerAssets')
tasks.register('generateLedgerAssets') {
    inputs.file(frontend)
    outputs.dir(generatedAssets)
    doLast {
        def text = frontend.getText('UTF-8')
        // The installed page has no network dependencies; system font fallbacks are intentional.
        text = text.replaceAll(/(?m)^<link[^>]*https:\/\/fonts\.(googleapis|gstatic)\.com[^>]*>\r?\n/, '')
        text = text.replaceAll(/(?m)^<base[^>]*>\r?\n/, '')
        def output = generatedAssets.get().file('Index.html').asFile
        output.parentFile.mkdirs()
        output.setText(text, 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.named('preBuild').configure { dependsOn('generateLedgerAssets') }
