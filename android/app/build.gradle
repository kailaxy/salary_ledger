plugins { id 'com.android.application' }

def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def signingEnv = ['LEDGER_KEYSTORE_PATH', 'LEDGER_KEYSTORE_PASSWORD', 'LEDGER_KEY_ALIAS', 'LEDGER_KEY_PASSWORD']
def signingValues = signingEnv.collectEntries { [(it): System.getenv(it)] }
def debugKeystore = System.getenv('LEDGER_DEBUG_KEYSTORE_PATH')
def debugPreview = System.getenv('LEDGER_DEBUG_PREVIEW') == 'true'
if (System.getenv('LEDGER_REQUIRE_DEBUG_KEY') == 'true' && !debugKeystore) {
    throw new GradleException('Persistent development builds require LEDGER_DEBUG_KEYSTORE_PATH; see android/README.md')
}
if (releaseRequested && signingValues.any { key, value -> !value }) {
    throw new GradleException('Release builds require all four LEDGER signing environment variables; see android/README.md')
}
def buildNumber = System.getenv('LEDGER_VERSION_CODE') ?: '3'
if (!(buildNumber ==~ /[0-9]+/) || buildNumber.toLong() < 3 || buildNumber.toLong() > 2100000000) {
    throw new GradleException('LEDGER_VERSION_CODE must be an integer from 3 to 2100000000')
}

def otaKey = providers.environmentVariable('LEDGER_OTA_PUBLIC_KEY').orElse('').get().trim()
def otaBase = providers.environmentVariable('LEDGER_OTA_BASE').orElse('https://github.com/kailaxy/salary_ledger/releases/download/').get().trim()
if (otaKey && !(otaKey ==~ /[A-Za-z0-9+\/=]{400,1200}/)) throw new GradleException('LEDGER_OTA_PUBLIC_KEY must be a base64 RSA SubjectPublicKeyInfo DER key')
if (otaKey) {
    try {
        def decoded = java.util.Base64.decoder.decode(otaKey)
        def key = java.security.KeyFactory.getInstance('RSA').generatePublic(new java.security.spec.X509EncodedKeySpec(decoded))
        if (((java.security.interfaces.RSAPublicKey) key).modulus.bitLength() < 3072) throw new IllegalArgumentException('Weak OTA key')
    } catch (Exception error) { throw new GradleException('Invalid RSA OTA public key; run tools/ota/setup.py', error) }
}
if (!(otaBase ==~ /https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/releases\/download\//)) throw new GradleException('Invalid LEDGER_OTA_BASE')
def frontendRevision = System.getenv('LEDGER_FRONTEND_REVISION') ?: ''
if (!frontendRevision) {
    def shallow = providers.exec { workingDir rootProject.projectDir; commandLine 'git', 'rev-parse', '--is-shallow-repository'; ignoreExitValue true }.standardOutput.asText.get().trim()
    if (otaKey && shallow != 'false') throw new GradleException('OTA builds require full Git history or LEDGER_FRONTEND_REVISION')
    frontendRevision = providers.exec { workingDir rootProject.projectDir; commandLine 'git', 'rev-list', '--count', 'HEAD'; ignoreExitValue true }.standardOutput.asText.get().trim()
}
if (!(frontendRevision ==~ /[0-9]{1,15}/)) { if (otaKey) throw new GradleException('Invalid frontend revision'); frontendRevision='0' }
frontendRevision=frontendRevision.toLong().toString()

android {
    namespace 'com.kailaxy.salaryledger'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kailaxy.salaryledger'
        minSdk 26
        targetSdk 35
        versionCode buildNumber.toInteger()
        versionName '0.5.0'
        resValue 'string', 'app_name', 'Salary Ledger'
        buildConfigField 'String', 'OTA_PUBLIC_KEY', '"' + otaKey + '"'
        buildConfigField 'String', 'OTA_BASE', '"' + otaBase + '"'
        buildConfigField 'String', 'OTA_CHANNEL', '"stable"'
        buildConfigField 'long', 'FRONTEND_REVISION', frontendRevision + 'L'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (debugKeystore) {
                storeFile file(debugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (signingValues.every { key, value -> value }) {
                storeFile file(signingValues.LEDGER_KEYSTORE_PATH)
                storePassword signingValues.LEDGER_KEYSTORE_PASSWORD
                keyAlias signingValues.LEDGER_KEY_ALIAS
                keyPassword signingValues.LEDGER_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'OTA_CHANNEL', debugPreview ? '"preview"' : '"dev"'
            applicationIdSuffix debugPreview ? '.debug.preview' : '.debug'
            versionNameSuffix debugPreview ? '-preview' : '-dev'
            resValue 'string', 'app_name', debugPreview ? 'Salary Ledger Preview' : 'Salary Ledger Dev'
        }
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}

def frontend = rootProject.file('../Index.html')
def generatedAssets = layout.buildDirectory.dir('generated/ledgerAssets')
tasks.register('generateLedgerAssets') {
    inputs.file(frontend)
    outputs.dir(generatedAssets)
    doLast {
        def text = frontend.getText('UTF-8')
        // The installed page has no network dependencies; system font fallbacks are intentional.
        text = text.replaceAll(/(?m)^<link[^>]*https:\/\/fonts\.(googleapis|gstatic)\.com[^>]*>\r?\n/, '')
        text = text.replaceAll(/(?m)^<base[^>]*>\r?\n/, '')
        def output = generatedAssets.get().file('Index.html').asFile
        output.parentFile.mkdirs()
        output.setText(text, 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.named('preBuild').configure { dependsOn('generateLedgerAssets') }
